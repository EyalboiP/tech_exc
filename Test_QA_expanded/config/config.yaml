# Ammeter testing framework configuration.
# Every value here can be overridden from the CLI (see `python run_tests.py --help`).

testing:
  host: localhost
  start_emulators: true          # false -> connect to emulators that are already running
  startup_timeout_seconds: 5
  ammeters: null                 # null = all ammeters below, or a list e.g. [greenlee, entes]
  timeout_seconds: 2             # socket timeout per measurement
  retries: 0                     # extra attempts per failed measurement (0 = failures are reported as-is)
  sampling:
    # Provide at least TWO of the three; the third one is derived.
    #   duration = count / frequency
    measurements_count: 30
    total_duration_seconds: null
    sampling_frequency_hz: 10

ammeters:
  greenlee:
    port: 5000
    command: "MEASURE_GREENLEE -get_measurement"
  entes:
    port: 5001
    command: "MEASURE_ENTES -get_data"
  circutor:
    port: 5002
    command: "MEASURE_CIRCUTOR -get_measurement"

# Error simulation: only applies to emulators started by the framework.
# A per-ammeter override is possible, e.g. under `ammeters.entes.faults:` use the same keys.
fault_simulation:
  enabled: false
  drop_rate: 0.0       # probability the emulator closes the connection without replying
  garbage_rate: 0.0    # probability the emulator replies with a non-numeric payload
  delay_rate: 0.0      # probability the reply is delayed...
  delay_ms: 0          # ...by this many milliseconds
  seed: null           # set a number for a reproducible fault sequence

analysis:
  statistical_metrics: [mean, median, std, min, max]   # shown in the console/HTML summary (all are always stored)
  conformance_z_threshold: 4.0   # |z| above this flags a mean that disagrees with the theoretical expectation
  visualization:
    enabled: true
    plot_types: [time_series, histogram, boxplot]

result_management:
  results_dir: results
  save_json: true
  save_csv: true
  save_sqlite: true
  html_report: true

logging:
  level: INFO
